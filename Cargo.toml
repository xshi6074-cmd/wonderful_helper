[package]
name = "premortem"
version = "0.1.0"
edition = "2024"
description = "Premortem —— 把撞墙之后才学到的东西，前移成动手之前的强制检查"

[dependencies]
# 运行时：SessionActor(Core) / turn task / subagent 都是 tokio task
tokio       = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "net", "signal"] }
# CancellationToken：全项目唯一的取消手段，绝不使用 JoinHandle::abort
tokio-util  = { version = "0.7", default-features = false }
# FuturesUnordered：run_tools 里并行工具的汇聚点
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
uuid        = { version = "1", features = ["v4"] }
thiserror   = "2"
# 持久层是用户直接编辑的文件，所以要人写得动的格式
toml        = "0.9"
# 主时间线的存储。bundled 直接编进来，避开 WSL/Windows 上系统 sqlite 版本不一的麻烦。
# 同步 API 正合适：写连接本来就独占给 writer 一个 task。
rusqlite    = { version = "0.37", features = ["bundled"] }
# 本地检索直接用 ripgrep 自己的那套 crate。手写目录遍历 + .gitignore 解析
# 是典型的「看着简单、边界条件能写一年」的活：嵌套 ignore 文件、否定规则、
# 符号链接、二进制探测、编码嗅探。这几个 crate 就是 ripgrep 的实现本体。
ignore        = "0.4"   # gitignore 感知的目录遍历
globset       = "0.4"   # --glob 过滤
grep-searcher = "0.1"   # 行搜索 + 上下文行 + 二进制检测
grep-regex    = "0.1"   # 搜索用的正则匹配器
grep-matcher  = "0.1"   # Matcher trait
# 真实模型调用：HTTPS + 流式。rustls 而不是 openssl，省掉在 Windows/WSL 两边
# 各装一套系统库的麻烦。SSE 自己解（十几行），不再引一个 eventsource crate。
# SSE 那段流式转换写成 stream! 宏，比手搓 unfold 状态机可读得多
async-stream  = "0.3"
# UI：axum + WebSocket。前端**零构建步骤** —— 纯 ES module + CSS 用 include_str!
# 编进二进制，没有 node、没有打包器。将来套 webview 做桌面版也只是指向 localhost。
axum          = { version = "0.8", features = ["ws"] }
# markdown 在 Rust 侧渲染：不引 JS 依赖，而且**天生免疫 XSS** ——
# 模型输出里的 raw HTML 事件被直接丢掉，不可能进 DOM。
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
reqwest       = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "charset", "http2"] }
# 内置网页抓取：Readability 按 DOM 结构/文本密度抽正文，再转成保留标题、列表、
# 表格、代码与链接的 Markdown。全是 Rust 依赖，不要求 Python、浏览器或 Docker。
dom_smoothie  = "0.18"
htmd          = "0.5.5"
encoding_rs   = "0.8"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "test-util"] }
