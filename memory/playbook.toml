# 易犯错场景与对应指令。随时修改。
# guidance 写给模型看，措辞应是建议与约束。
# tools 只决定这个场景下模型能看见哪些工具。
# 必须保留一个 id = "none" 的场景作为回退。

default_tools = [
    "record_graph",
    "record_note",
    "fs_read",
    "fs_grep",
    "fs_find",
    "repo_tree",
]

[[scene]]
id = "cheap_first"
label = "优先低成本试验"
when = "如果讨论较长（10轮+），从推断图看细节丰满，当前问题难通过继续讨论敲定方案，有几个候选，可以考虑建议用户先做低成本尝试。"
guidance = "根据实际建议先做能最快证伪/排除某些选项的最小实验。给出它要花多少、能排除什么。"
tools = []

[[scene]]
id = "bad_implementation"
label = "新方法要插入模型的接口不明确"
when = "用户只给出了很模糊的描述，例如我要把xx模块换成xx模块，预期结构只被泛泛描述"
guidance = "结合现有信息在推断图里标明未定接口，指出可能错误。"
tools = ["record_graph",
    "record_note",]

[[scene]]
id = "clarify_goal"
label = "澄清目标"
when = "用户描述的 claim 模糊。引导用户给出更多信息"
guidance = "用户的目标还没落定。建议先把「要验证什么」问清楚再往下。新手答不上开放式问题，如果要问，尽量带上候选项（用 ask_user 工具）。不确定的部分不要替用户补全。"
tools = ["ask_user"]

[[scene]]
id = "diverge_design"
label = "发散设计"
when = "只有一个方案却要下结论，或者对照组明显不足以支撑 claim"
guidance = "对照空间还没铺开。建议把可能的对照/消融列出来再收敛，列的时候说明每一条能排除什么可能性。不用追求穷尽。铺出来的对照臂用 record_graph 画成 ablation / baseline 节点，用户要在图上直接删改的就是它们。"
tools = []

[[scene]]
id = "none"
label = "不做特殊干预"
when = "用户的话是闲聊、确认、或已经很明确的具体请求"
guidance = "正常回答。不要为了显得尽职而额外提问。"
tools = []

[[scene]]
id = "stop_and_implement"
label = "停止讨论进入实现"
when = "该定的都定了，再讨论边际收益很低"
guidance = "该收尾了。产出给下游编码 agent 的 brief：要验证的 claim / 要改的具体位置 / 必须保持不变的东西 / 对照清单 / 怎么算验收通过。写 brief 之前先用 record_note 把验收口径落下来（open 里应该清空得差不多了）。**是否真的进入实现由用户拍板，你只给 brief，不要替他宣布开始。**"
tools = []

[[scene]]
id = "teach_background"
label = "补充领域背景"
when = "用户储备记录显示这个知识域他明确没有储备，或者他自陈不熟"
guidance = "先把机制讲通，再把判断交回给用户。讲解要落到他这个仓库/这个实验上，不要泛泛介绍概念。讲完可以问一句他是否要按这个理解继续。"
tools = []

[[scene]]
id = "trace_code"
label = "追踪代码链路"
when = "用户要改某个模块，但对话里看不出他确认过这个模块的输出被谁消费"
guidance = '建议先把相关的调用链路走一遍再谈改法 —— repo_tree 看结构、fs_grep 找引用、fs_read 读具体位置。读到什么就用 record_graph 补到图上，source 填 {"repo": "路径:行号"}。读不到的不要猜，要猜就标 source="guess"（会画成虚线）。'
tools = [
    "fs_read",
    "fs_grep",
    "fs_find",
    "repo_tree",
]
