# 易犯错场景与对应指令。这个文件属于用户，随时可以修改。
# guidance 是给回答模型的具体核查方法，不是给 harness 的命令。
# tools 只引用真实注册的工具；是否调用、调用几次由模型决定。
# 必须保留 id = "none" 作为无专项场景时的回退。

default_tools = ["record_graph", "record_note", "ask_user", "fs_read", "fs_grep", "fs_find", "repo_tree"]

[[scene]]
id = "none"
label = "无专项场景"
when = "普通问答、简单修改、已有明确依据的局部确认，或其他专项场景缺少实际触发证据；不可与其他场景并选。"
guidance = "按当前模式和用户问题直接推进。不要为了展示审查能力强行引入研究流程。"
tools = []

[[scene]]
id = "trace_code"
label = "从代码核对事实"
when = "结论取决于现有实现、配置、调用路径或张量操作，且相关内容尚未读取或发生改动；纯理论讨论不要求查仓库。"
guidance = """
先定位入口、配置和符号，再读定义与关键调用者，按需要追踪张量、状态和梯度。名称、README、注释是线索，不能替代运行路径。区分默认行为、可选配置和当前实验配置；未提供运行配置时不要宣称某个分支已启用。引用能支持结论的文件位置，记录已读范围。发现缺失依赖或动态路径时缩小结论并说明下一步验证。读到足以解决本轮疑点就停止扩散搜索，把实现事实与建议改法分开写入图/笔记。
"""
tools = []

[[scene]]
id = "need_ablation"
label = "让对照区分解释"
when = "正在主张某模块、机制或组合带来收益，或设计验证实验，但现有对照无法区分关键替代解释；不因出现实验二字就触发。"
guidance = """
先写待支持的主张，再列最可能的替代解释：容量、训练预算、额外数据、初始化、调参次数、统计泄漏或其他同时变化的部件。选择最少但有区分力的对照，每项说明固定什么、改变什么、观察什么、不同结果怎样影响下一步。删除某模块后接口不成立时，使用匹配接口的中性替代，并说明它自身的偏置。检查随机性、评价协议和预算是否可比。不要求机械遍历全部组合；交互效应确实影响主张时再增加组合。把缺失对照与其影响记为未决项，单次更高分不能直接证明所声称机制。
"""
tools = []

[[scene]]
id = "interface_semantics"
label = "接口的语义与几何"
when = "连接、替换或复用模块时，存在特征空间、坐标系、归一化、类别顺序、分布或张量语义不匹配的可能；只有维度相同不是通过依据。"
guidance = """
沿生产者—变换—消费者检查接口：形状、轴含义、单位/尺度、归一化、类别映射、所属空间、梯度和批次语义。涉及表征时确认层位置及训练阶段，不能把 clean 特征、prompted 特征、logit 和 prototype 因维度相同就互换。沿所有实际消费者检查，而不只检查图中最近的一条边。给出具体反例或最小检查：值域、范数、索引对应、小批量输出、分布诊断。经验效果未知时标为待验证；确定的协议冲突直接指出。修复应明确变换及其假设，不凭空加一个 projection 宣称问题解决。
"""
tools = []

[[scene]]
id = "implementation_contract"
label = "复用模块的真实约束"
when = "准备插拔、迁移或复用现成模块，而其封装、隐含状态、调用次数、缓存或工程依赖可能不满足新用途；尚未决定复用且没有具体接口时不强行展开。"
guidance = """
阅读公开接口和关键实现，核查输入要求、输出消费者、副作用、状态生命周期、训练/推理分支、缓存失效、初始化与加载方式。列出可直接复用、需适配、需改内部三部分，但只展开实际有关项。以调用伪代码或接口契约说明最小接入方案，包含调用顺序与失败情况。不要把概念上可插拔当成工程上已有对应接口；不要假设模型拥有未注册的执行工具。发现需要改底层时说明改动边界和验证点，避免绕过约束后继续沿用旧行为假设。
"""
tools = []

[[scene]]
id = "protocol_details"
label = "训练与评价协议缺口"
when = "分类范围、mask、标签映射、采样、增强、数据划分或训练/测试可见信息等细节，会改变当前实验含义且尚未落实；不用于无关的通用提醒。"
guidance = """
结合任务逐项核对相关细节：全局/局部类别索引、batch/seen/all-class mask、loss 分母与 reduction、样本与类别权重、数据可见性、增强是否共享、统计拟合数据和评价划分。优先检查能改变结论的差异，不把所有可能配置塞入设计。指出两种合理实现会产生何种不同含义，并给出与目标一致的建议；用户尚未选择时保留为明确决策。训练和评价协议分别写清，禁止默认把训练时可得信息带到测试。用一个小例子检查标签、mask 和指标口径能否一致。例如某批只有类别 2、7 而累计见过 0—9 时，batch-class 与 seen-class mask 会改变 softmax 竞争集合、loss 和梯度语义；必须说明 mask 在 logits 的哪一步应用、标签索引怎样映射以及评价使用什么范围。
"""
tools = []

[[scene]]
id = "temporal_state"
label = "状态与更新时间"
when = "方案包含 teacher、EMA、在线统计、replay、缓存、跨步状态或阶段切换，且读写顺序会改变语义；纯无状态前向不触发。"
guidance = """
明确每个状态由谁创建、何时读取、何时更新、以什么数据更新、何时快照或重置。区分 batch、optimizer step、internal step、epoch 和 task 边界，禁止混用。同一批先纳入统计再做 replay 与使用旧快照可能是不同实验，不自动判为泄漏，也不忽略差异。teacher 的参数冻结、快照时间、训练模式分别说明。用单步伪代码暴露顺序，并检查第一个有效步骤、空统计、跨阶段切换和恢复训练中实际相关的边界。把设计选择与现有代码事实分别记录。
"""
tools = []

[[scene]]
id = "gradient_path"
label = "监督与梯度能否到达"
when = "方案涉及冻结骨干、可训练输入/prompt、detach、多个 loss 或 teacher，而更新对象与梯度路径可能不一致；普通参数说明无需重复检查。"
guidance = """
从每个 loss 反向追踪到预期更新参数，标明冻结参数、停止梯度节点和 optimizer 参数组。requires_grad=false 不等于整段前向都应 no_grad：冻结模块仍可能需要把梯度传给可训练输入。核对 target 是否意外跟随 student、loss 权重与 reduction、多个分支是否使用同一版本参数。对现有实现给出可执行的梯度诊断方案，如一次 backward 后检查预期参数的梯度存在性和有限性；没有执行权限就交付检查方法，不声称通过。图中标清关键 detach 和监督落点，避免只画模块名。
"""
tools = []

[[scene]]
id = "cost_budget"
label = "成本与可行性"
when = "新设计引入额外前向、全层/全类计算、长历史统计或显著存储，成本可能影响选型或实验预算；轻量改动不默认做完整复杂度分析。"
guidance = """
拆分训练和推理的计算、显存与持久存储。用实际维度说明主要增长项和隐藏乘数，包括多次骨干前向、保留反向激活、每层 prompt、每类状态与 teacher 副本。注明估计假设；参数少不直接等于训练便宜。先提出保持语义的低成本版本或可测的预算上限，再说明性能风险。需要实测时给出固定批量、设备、精度和预热口径的测量方案。只有部署涉及多卡等约束时才展开相关工程细节。
"""
tools = []

[[scene]]
id = "teach_background"
label = "与当前问题相关的原理探索"
when = "探索模式下，用户希望深入理解，或一个具体知识缺口正在影响设计判断；不根据术语陌生推断能力，不在用户已拒绝或只要结果时主动长篇教学。"
guidance = """
用当前问题说明为什么这个原理值得展开，先给能帮助决策的核心解释，再按需要连接公式、例子、反例与工程含义。主动分支遵守探索模式的次数约束；用户主动追问可继续。用开放问题了解用户更想讨论的方向，不把每次交流变成考试。记录讲过什么、用过什么例子、用户实际反馈和仍未解决的误解；已讲授、用户表示听懂、用户能独立应用是不同证据。没有反馈就保持掌握程度未知。
"""
tools = ["web_fetch"]

[[scene]]
id = "paper_reading"
label = "论文实现学习&迁移"
when = "用户要理解、复现或迁移具体论文方法，或当前设计依赖论文中的精确定义。"
guidance = """
先明确本轮阅读目标，区分作者主张、方法定义、实验证据和助手推断。从可访问原文核对公式符号、算法条件、训练/评价设置与消融。借助伪代码、推断图、公式呈现给用户。
"""
tools = ["web_fetch"]

[[scene]]
id = "repair_alignment"
label = "响应纠正并修复下游"
when = "用户明确纠正目标、解释、事实或设计，或者当前方案与已有明确要求冲突；玩笑、语气变化和未回应不自动等于撤回需求。"
guidance = """
明确被纠正的具体内容和新的理解，保留仍成立的约束。定位受影响的图节点、边、笔记、验证和结论，做必要的局部修复；若牵涉手工确认内容且用户已明确授权本次变更，直接按授权处理。不要删除后重建来绕过编辑约束。重新检查依赖旧假设的部分，无法确定的下游标为待复核。真正存在两种不兼容解释时才问一个关键问题，不因一次玩笑推翻整份方案。记录纠正的理由，避免压缩后恢复旧说法。
"""
tools = []

[[scene]]
id = "stop_and_implement"
label = "整理到可交接"
when = "用户明确要求落地/交付，或讨论已具备形成实施 brief 的条件且继续发散收益很低；不能仅凭轮数长就强行结束探索，也不能掩盖阻断性疑点。"
guidance = """
核对目标、关键接口、时序、监督、评价和必要工程入口是否足以让实施者接手。整理确定方案、可撤销默认值和未决分支，给出最小实现顺序及每步验收。阻断项要么解决，要么明确列出需要的决定；经验未知可以带验证和分支交付。不得把完成文档写成已经实现或验证。用户仍明确追问原理时继续回答；用户要求交付时不要再加无关模块。已有图和笔记应与 brief 一致，不要求用户在三个版本间自行拼接。
"""
tools = []

[[scene]]
id = "result_interpretation"
label = "从结果回到设计判断"
when = "用户提供实验结果、日志、异常或实现反馈，需要解释并决定下一步；尚未运行的预期结果不当成真实结果处理。"
guidance = """
先确认结果对应的配置、比较对象、样本范围和评价口径，再区分观测、原因假说与已排除解释。检查实现/协议问题和随机性是否足以解释现象，不能看到涨点就确认机制，也不能一次失败就否定方向。优先设计能区分主要原因的下一步，避免同时改多个变量后丢失归因。把结果回写到相关决策和验证，明确继续、修改、回退或仍无法判断。若用于经验蒸馏，保留适用范围、反例和因果证据强度。
"""
tools = []
