# 易犯错场景与对应指令。随时修改。
# guidance 写给模型看，措辞应是建议与约束。
# tools 只决定这个场景下模型能看见哪些工具。
# 必须保留一个 id = "none" 的场景作为回退。

default_tools = [
    "record_graph",
    "record_note",
    "fs_read",
    "fs_grep",
    "fs_find",
    "repo_tree",
    "web_fetch",
]

[[scene]]
id = "cheap_first"
label = "优先低成本试验"
when = "如果讨论较长（10轮+），从推断图看细节丰满，当前问题难通过继续讨论敲定方案，有几个候选，可以考虑建议用户先做低成本尝试。"
guidance = "根据实际建议先做能最快证伪/排除某些选项的最小实验。给出它要花多少、能排除什么。"
tools = ["record_graph",
    "record_note",]

[[scene]]
id = "bad_implementation"
label = "新方法要插入模型的接口不明确"
when = "用户只给出了很模糊的描述，例如我要把xx模块换成xx模块，预期结构只被泛泛描述"
guidance = "结合现有信息在推断图里标明未定接口，指出可能错误。"
tools = ["record_graph",
    "record_note",]

[[scene]]
id = "clarify_goal"
label = "澄清目标"
when = "用户描述的 claim 模糊。引导用户给出更多信息"
guidance = "用户的目标还没落定。建议先把「要验证什么」问清楚再往下。新手答不上开放式问题，如果要问，尽量带上候选项（用 ask_user 工具）。不确定的部分不要替用户补全。"
tools = ["ask_user"]

[[scene]]
id = "need_ablation"
label = "消融不充分"
when = "用户给出实验方案，但是基线必要却明显没有"
guidance = "对照空间还没铺开。建议把可能的对照/消融列出来再收敛，列的时候说明每一条能排除什么可能性。不用追求穷尽。铺出来的对照臂用 record_graph 画成 ablation / baseline 节点，用户要在图上直接删改的就是它们。"
tools = ["record_graph",
    "record_note",]

[[scene]]
id = "none"
label = "不做特殊干预"
when = "用户的话是闲聊、确认、或已经很明确的具体请求"
guidance = "正常回答。不要为了显得尽职而额外提问。"
tools = []

[[scene]]
id = "stop_and_implement"
label = "停止讨论进入实现"
when = "该定的都定了，可以给出实现方案。"
guidance = "该收尾了。参考推断图，整合讨论得出的有效信息，去除矛盾部分，给出详细的实验方案。参考内容：要验证的 claim / 要改的具体位置 / 必须保持不变的东西 / 对照清单 / 怎么算验收通过。写 brief 之前先用 record_note 把验收口径落下来（open 里应该清空得差不多了）。"
tools = []

[[scene]]
id = "teach_background"
label = "补充领域背景"
when = "用户储备记录显示这个知识域他明确没有储备，或者他自陈不熟"
guidance = "先把机制讲通，再把判断交回给用户。讲解要落到他这个仓库/这个实验上，不要泛泛介绍概念。如果已有论文网址，可以调用 web_fetch 读取正文。"
tools = ["web_fetch",
    "record_graph",
    "record_note",]

[[scene]]
id = "trace_code"
label = "追踪代码链路"
when = "用户给出模糊实验idea或方向，但推断图尚无或不完整，用户给出仓库/文件夹/论文（当用户希望根据论文做ablation或模块插拔）。"
guidance = '你需要整理实验预期架构，清晰梳理文件或论文，结合用户的模糊idea给出实验方法架构图。—— repo_tree 看结构、fs_grep 找引用、fs_read 读具体位置。读到什么就用 record_graph 补到图上，source 填 {"repo": "路径:行号"}。目前尚不能确定（比如用户模块插入后哪块可以改哪块不能）写未定，猜测标 source="guess"（会画成虚线）。推测图必须细节丰富，即使用户只给出泛泛想法——把用户未考虑清，但画架构图需要的细节标未定———比如用户可能忽略维度/必要方法（mask etc）/工程细节（DDP ect）/指标'
tools = [
    "fs_read",
    "fs_grep",
    "fs_find",
    "repo_tree",
    "record_graph",
    "record_note",
    "web_fetch",
]
